name: Undercover database health

on:
  schedule:
    - cron: '17 1,9,17 * * *'
      timezone: Europe/Oslo
  workflow_dispatch:
    inputs:
      test_only:
        description: Validate the monitor without contacting Supabase
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: database-health
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'eiriknicholas/undercover-health' && (vars.MONITOR_ENABLED == 'true' || inputs.test_only == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate monitor
        run: node --test tests/*.test.mjs
      - name: Check database and record status
        if: inputs.test_only != true
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check.mjs
